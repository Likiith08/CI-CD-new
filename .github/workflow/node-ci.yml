name: Node.js CI

on:
   push:
    branches:
      -main

  pull_request:
    branches:
      -main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        users: actions/checkout@v4

      - name: Setup Node.js
        users: actions/setup-node@v4
        with:
          node-version: 20

      - name: install dependencies
        run: npm install

      -name: run tests
        run: npm test